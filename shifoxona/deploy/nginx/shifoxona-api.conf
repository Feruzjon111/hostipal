# Har bir API so'rovi faqat Laravel front controller orqali o'tadi.
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/shifoxona/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/shifoxona/backend/public;
fastcgi_param HTTPS $https if_not_empty;
fastcgi_pass unix:/run/php/php8.3-fpm.sock;
