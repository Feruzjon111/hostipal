server {
    listen 80;
    listen [::]:80;
    server_name shifo.example.com;

    root /var/www/shifoxona/frontend/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api {
        include /etc/nginx/snippets/shifoxona-api.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/shifoxona-api.conf;
    }

    location = /up {
        include /etc/nginx/snippets/shifoxona-api.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
